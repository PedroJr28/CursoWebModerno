<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Display</title>
    <style>
        body{
            font-size: 40px;
            color: #fff;
            background-color: coral;
        }
        ul{padding: 0%;}
        div{background-color: seagreen;}
        span{ background-color:dodgerblue ;}
        li{background-color: purple;}

        div,span,li {
            width: 50%; /* deixa metado do largura da div */
            width: 200px; /* ajusta o largura da div */
            height: 80px; /* ajusta a altura da div */
            padding-top: 30px; 
            text-align: center;
            display: block; /* cada elemento vai ter sua própria linha */
            display: inline; /* cada elemento vai ficar na mesma  linha, não considera nem a altura e nem a largura  */
            display: inline-block; /* cada elemento vai ficar na mesma  linha,  considerando  a altura e  a largura  */

        } 
    </style>
</head>

<body>
    <div>Texto 1</div>
    <span>Texto 2</span>
    <span>Texto 3</span>
    <ul>
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
    </ul>
</body>

</html>
