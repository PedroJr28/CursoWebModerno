<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Cores</title>
    <style>
        /* 
            https://www.w3schools.com/colors/colors_hsl.asp
            
            https://coolors.co/
            http://paletton.com/
        */
        body{
            background-color: green; /* pode escrever as cores ou selecionar */
            background-color: #f67809; /* pode escrever em forma exdecimal*/
            background-color: #aabbcc; /* pode escrever em forma de letra*/
            background-color: #e928;/* pode escrever dessa forma e colocar o nivel de transparência*/
            background-color: rgb(red, green, blue); /* pode escrever dessa forma RGB cores primárias */
            background-color: rgba(55, 110, 220, .5); /* pode escrever dessa forma RGBA colocando o nível de transparência  */
            background-color: hsl(299, 58%, 50%); /* pode escrever dessa forma utilizando saturação  */
            background-color: hsla(299, 58%, 50%, 0.5); /* pode escrever dessa forma utilizando saturação e colocando o nível de transparência  */
        }
    </style>
</head>
