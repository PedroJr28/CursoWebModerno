<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Float</title>
    <style>
        body {
            background-color: #222;
        }

        .c1 {
            background-color: red;
            float: right; /* FICA FLUTUANDO PARA A DIREITO*/
        }

        .c2 {
            background-color: green;
            clear: right; /* DESSE UMA LINHA PARA DEIXAR ESPAÇO DA DIV QUE FOI APLICADO O FLOAT*/
        }
        
        .c3 {
            background-color: blue;
        }

        .c4 {
            background-color: orange;
        }
        div{
            height: 150px;
            width: 150px;
        }
    </style>
</head>

<body>
    <div class="c1"></div>
    <div class="c2"></div>
    <div class="c3"></div>
    <div class="c4"></div>
</body>

</html>
